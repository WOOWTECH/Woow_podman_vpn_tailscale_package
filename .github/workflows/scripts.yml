# .github/workflows/scripts.yml: repo-specific script checks. The quadlet-ci.yml workflow is
# vendored and checksummed against scripts/lib/quadlet-lib.manifest, so repo-specific jobs
# live here instead.
name: scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detached-env:
    runs-on: ubuntu-24.04          # systemd 255, same as the WOOWTECH hosts
    steps:
      - uses: actions/checkout@v4

      # The transient units of scripts/migrate-legacy.sh start from the user manager's
      # environment, not from the caller's shell. This asserts that everything the detached
      # half reads is named on the systemd-run command line, and - where a user manager is
      # reachable - that a real transient unit receives it. podman, systemctl and
      # systemd-run are stubbed for everything but that probe; no container is started.
      - name: Transient units carry the environment they need
        run: tests/detached-env.sh

  rollback-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # tests/rollback-model.sh drives the legacy rollback helpers of migrate-legacy.sh
      # against the doubles in tests/shims (podman, systemctl): no container is created and
      # the runner's user manager is never touched.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | sed -n 2p

      - name: shellcheck the test doubles
        run: shellcheck -x tests/shims/podman tests/shims/systemctl

      - name: Legacy rollback model (rename vs capture)
        run: tests/rollback-model.sh

      # tests/host-tree.sh pins the refusals for a host that runs a tailscale node of a
      # different lineage (openclaw's woow-tailscale-gateway): the name must not
      # false-positive-match, install.sh must not be recommended, and a unit with
      # Exec*Pre/Post hooks or a drop-in must be refused.
      - name: Host-tree and lineage guards
        run: tests/host-tree.sh
